# =====================================================================
# AWS Lambda (extension quarkus-amazon-lambda-rest)
# ---------------------------------------------------------------------
# Formato de evento: API Gateway REST API -> payload format 1.0
# (AwsProxyRequest / AwsProxyResponse). Es el que usa este POC.
#
# Si en algun momento se migra a API Gateway HTTP API (payload 2.0),
# ALB o Function URL, hay que cambiar la dependencia en el pom.xml a
# quarkus-amazon-lambda-http.
#
# Empaquetado como imagen de contenedor (ver Dockerfile en la raiz):
#   NATIVE=true  -> provided.al2023, el binario es /var/runtime/bootstrap
#   NATIVE=false -> base de Lambda para Java,
#                   handler io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
# =====================================================================

# Nivel de log: en Lambda todo va a CloudWatch Logs
quarkus.log.level=INFO
quarkus.log.category."bancatlan.hn".level=INFO

# =====================================================================
# NOTA: aqui NO va configuracion de build nativo.
#
# Las opciones quarkus.native.* son decisiones del ENTORNO que compila
# (dentro o fuera de contenedor, que imagen builder, cuanta memoria), no
# de la aplicacion. Si viven aqui, viajan con el artefacto y quedan mal en
# alguno de los dos contextos: dentro del Dockerfile ya estamos en la
# imagen builder, y en una laptop Windows hace falta lo contrario.
#
# Estan en el perfil `native` del pom.xml, se aplican solo cuando se pide
# compilacion nativa y se pueden sobreescribir por linea de comandos:
#   ./mvnw package -Pnative -Dquarkus.native.native-image-xmx=6g
# =====================================================================
